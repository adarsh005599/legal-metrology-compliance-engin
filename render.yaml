services:
  - type: web
    name: legal-metrology-compliance-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
